<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Pinyon+Script&amp;display=swap');
      .cursive-l {
        font-family: 'Alex Brush', 'Pinyon Script', 'Italianno', 'Cormorant Garamond', cursive, serif;
        font-size: 50px;
        fill: #171615;
        font-weight: 500;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Background matching website #FAF8F5 -->
  <rect width="64" height="64" rx="14" fill="#FAF8F5" />
  
  <!-- Subtle inner border for luxury definition -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#E8E1D5" stroke-width="1" />

  <!-- Cursive 'L' Rendered with Font and Fallback Script Character -->
  <text x="32" y="34" class="cursive-l">L</text>
</svg>
